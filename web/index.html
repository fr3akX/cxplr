<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cxplr · Code Explore</title>
  <link rel="stylesheet" href="/vendor/highlight.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <span class="brand">cxplr <span class="muted brand-sub">Code Explore</span></span>
    <nav id="crumbs" aria-label="Zoom level"></nav>
    <span class="spacer"></span>
    <label class="toggle"><input type="checkbox" id="labels" checked> Edge labels</label>
    <button id="fit" type="button" title="Fit map to screen (F)">Fit</button>
    <span id="repo" class="muted"></span>
  </header>
  <main>
    <section id="stage">
      <svg id="graph" role="img" aria-label="Architecture map">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" class="arrow"></path>
          </marker>
          <marker id="arrow-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" class="arrow-hi"></path>
          </marker>
        </defs>
        <g id="viewport">
          <g id="edges"></g>
          <g id="nodes"></g>
          <g id="overlay"></g>
          <g id="sim"></g>
        </g>
      </svg>
      <div id="screen" hidden></div>
    </section>
    <aside id="side">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="details" class="active">Details</button>
        <button type="button" role="tab" data-tab="ask">Ask <span id="ask-busy" class="busy-dot" hidden></span></button>
      </div>
      <div id="panel"></div>
      <div id="ask" hidden>
        <div id="chat"></div>
        <div class="composer">
          <div id="ask-context" class="chips"></div>
          <textarea id="question" rows="3" placeholder="Ask about the code… (Ctrl+Enter to send)"></textarea>
          <div class="composer-row">
            <span class="muted small">Answered by Codex in a read-only sandbox; citations are checked against the files.</span>
            <button id="ask-send" class="primary" type="button">Ask</button>
          </div>
        </div>
      </div>
    </aside>
  </main>
  <div id="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="src-path">
      <div id="src-tabs" role="tablist" aria-label="Open files"></div>
      <div class="modal-head">
        <button id="src-back" type="button" title="Back (Alt+←)" disabled>‹</button>
        <button id="src-fwd" type="button" title="Forward (Alt+→)" disabled>›</button>
        <button id="src-outline-btn" type="button" title="Functions and classes in this file">Outline</button>
        <span id="src-path"></span>
        <span id="src-lsp" class="lsp-chip" hidden></span>
        <div class="find">
          <input id="find-q" type="search" placeholder="Find (Ctrl+F)" spellcheck="false" autocomplete="off"
            title="Enter: next · Shift+Enter: previous · Alt+Enter: search the repository · ignores case unless the query has capitals">
          <span id="find-count"></span>
          <button id="find-prev" type="button" title="Previous match (Shift+Enter)">↑</button>
          <button id="find-next" type="button" title="Next match (Enter)">↓</button>
          <button id="find-repo" type="button" title="Search the whole repository (Alt+Enter)">In repo</button>
        </div>
        <button id="src-ask" type="button" title="Ask about the selected lines (or the whole file)">Ask about selection</button>
        <button id="src-close" type="button" title="Close (Esc); open tabs are kept">Close</button>
      </div>
      <div class="modal-main">
        <nav id="outline" hidden>
          <input id="ol-filter" type="search" placeholder="Filter functions, classes…" spellcheck="false" autocomplete="off">
          <ul id="ol-list"></ul>
          <div id="ol-foot"></div>
        </nav>
        <div id="src-body"></div>
        <div id="sym" hidden></div>
      </div>
    </div>
  </div>
  <button id="sel-ask" type="button" class="primary" hidden></button>
  <script src="/vendor/highlight.js"></script>
  <script src="/app.js"></script>
</body>
</html>
