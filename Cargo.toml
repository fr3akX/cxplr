[package]
name = "cxplr"
version = "0.8.0"
edition = "2021"
description = "cxplr (Code Explore): learn a repository's architecture top-down, then drill in"
repository = "https://github.com/fr3akX/cxplr"

[dependencies]
axoupdater = "0.10.3"
axum = "0.8"
base64 = "0.23.1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3.34"
globset = "0.4.21"
ignore = "0.4"
jsonschema = { version = "0.60.2", default-features = false }
regex = "1.13.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "gzip", "brotli", "zstd", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal", "net"] }
uuid = { version = "1.29.0", features = ["v4"] }
xxhash-rust = { version = "0.8.19", features = ["xxh64"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
